body{background:var(--bg);background-image:radial-gradient(circle at 12% 4%,var(--bg-a) 0,transparent 42%),radial-gradient(circle at 88% 0,var(--bg-b) 0,transparent 42%);background-attachment:fixed;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.55;padding-bottom:150px;min-height:100vh;transition:background-color .25s,color .25s}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
/* 顶栏 */
.topbar{background:var(--grad);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 4px 16px var(--topbar-sh);transition:background .25s}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:18px;background:radial-gradient(circle at 14px 0,var(--grad-a) 6px,transparent 7px) repeat-x;background-size:28px 18px;opacity:.35}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding:12px 14px 12px;position:relative}
.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:800;white-space:nowrap;letter-spacing:.5px}
.brand .hp{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex:none}
.brand .sub{font-size:12px;font-weight:500;opacity:.9;white-space:nowrap}
.search{flex:1;min-width:120px;font-size:16px;padding:10px 16px;border:none;border-radius:22px;background:rgba(255,255,255,.96);font-family:inherit;color:var(--tx);height:46px;box-shadow:0 2px 8px var(--search-sh)}
.search::placeholder{color:var(--ph)}
/* 外观切换：女生 / 男生 */
.skin{display:flex;gap:3px;flex:none;padding:3px;height:40px;align-items:center;border-radius:20px;background:rgba(255,255,255,.26)}
.skin .sk{font-size:13px;font-weight:800;height:34px;padding:0 12px;border-radius:17px;color:#fff;opacity:.8;transition:background .18s,color .18s,opacity .18s}
.skin .sk:active{transform:scale(.95)}
.skin .sk.on{background:#fff;color:var(--pri);opacity:1;box-shadow:0 2px 6px rgba(0,0,0,.12)}
/* 单元条 */
.tabs{display:flex;gap:9px;overflow-x:auto;padding:16px 0 6px}
.tab{font-size:14px;font-weight:600;padding:10px 18px;border-radius:22px;background:var(--card);border:2px solid #fff;white-space:nowrap;min-height:44px;color:var(--chip);box-shadow:0 2px 8px var(--shadow)}
.tab.on{background:var(--grad);border-color:#fff;color:#fff;box-shadow:0 4px 12px var(--tab-sh)}
/* 分组 */
.grp{background:var(--card);border-radius:22px;margin-bottom:12px;overflow:hidden;box-shadow:0 3px 12px var(--shadow-s);border:2px solid #fff}
.grph{display:flex;align-items:center;gap:11px;width:100%;padding:13px 15px;min-height:62px;text-align:left}
.grph:active{background:var(--press)}
.grph .uic{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.grph .cv{flex:none;transition:transform .18s;color:var(--chev)}
.grph.open .cv{transform:rotate(90deg)}
.grph b{font-size:17px;font-weight:800;flex:none}
.grph .cnt{font-size:12px;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:11px;padding:3px 9px}
.grph .sp{flex:1}
.items{border-top:2px dashed var(--line-d)}
.item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:2px dashed var(--line-d2);min-height:62px}
.item:last-child{border-bottom:none}
.item.on{background:var(--item-on);box-shadow:inset 5px 0 0 var(--pri)}
.item .ic{width:34px;height:34px;border-radius:50%;background:var(--soft2);color:var(--ic);display:flex;align-items:center;justify-content:center;flex:none}
.item.on .ic{background:var(--grad);color:#fff}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:15.5px;font-weight:600;word-break:break-word;line-height:1.4}
.item .tx .last{font-size:12px;color:var(--pri);font-weight:600}
.item .du{font-size:12px;color:var(--mut2);flex:none;font-variant-numeric:tabular-nums}
.item .ck{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ck-bd);transition:transform .15s}
.item .ck:active{transform:scale(.86)}
.item .ck.on{background:#E4FBEF}

.eq{display:inline-flex;align-items:flex-end;gap:2px;height:15px}
.eq i{width:3px;height:5px;border-radius:2px;background:#fff;animation:eqb .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}
.eq i:nth-child(3){animation-delay:.3s}
@keyframes eqb{0%,100%{height:4px}50%{height:14px}}
.empty{text-align:center;color:var(--mut);padding:34px 0;font-size:15px}
.tip{color:var(--mut3);font-size:12px;text-align:center;padding:8px 0 2px}

.player{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--player-bd);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px var(--shadow);z-index:40;padding:11px 0 calc(11px + env(safe-area-inset-bottom))}
.player .wrap{padding:0 16px}
.pnm{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px;color:var(--pnm)}
.pbar{display:flex;align-items:center;gap:9px}
.tm{font-size:12px;color:var(--mut2);font-variant-numeric:tabular-nums;flex:none}

input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:var(--pri)}
.ctrls{display:flex;align-items:center;gap:7px;margin-top:6px}
.ibtn{width:48px;height:48px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--chip)}

.ibtn.main{width:58px;height:58px;background:var(--grad);color:#fff;box-shadow:0 4px 14px var(--thumb-sh)}
.rate{font-size:14px;font-weight:700;padding:0 12px;height:48px;border-radius:24px;background:var(--soft);color:var(--chip);min-width:56px}
.rate.on{background:var(--grad);color:#fff;box-shadow:0 3px 10px var(--tab-sh)}
.rate:active{transform:scale(.94)}

  .ibtn.main{width:54px;height:54px}
}

}

/* ---------- 渲染层（互不调用，统一由 refreshAll 调度） ---------- */
function renderTabs() {
  var us = units();
  var h = '<button class="tab' + (state.unit === "all" ? " on" : "") + '" data-act="unit" data-v="all">全部</button>';
  for (var i = 0; i < us.length; i++) {
    h += '<button class="tab' + (state.unit === us[i] ? " on" : "") + '" data-act="unit" data-v="' + esc(us[i]) + '">' + esc(us[i]) + "</button>";
  }
  document.getElementById("tabs").innerHTML = h;
}

function renderList() {
  var us = units(), h = "", shown = 0;
  for (var i = 0; i < us.length; i++) {
    var u = us[i];
    var all = unitTracks(u);
    var list = all.filter(match);
    if (!list.length) continue;
    shown += list.length;
    var open = isOpen(u);
    var done = all.filter(function (t) { return state.played[t.id]; }).length;
    var ic = UICON[u] || UDEF;
    h += '<div class="grp">' +
      '<button class="grph' + (open ? " open" : "") + '" data-act="fold" data-v="' + esc(u) + '">' +
      '<span class="uic" style="background:' + ic[0] + '"><svg width="21" height="21" viewBox="0 0 24 24" fill="' + ic[1] + '">' + ic[2] + "</svg></span>" +
      "<b>" + esc(u) + '</b><span class="cnt">' + done + "/" + all.length + "</span>" +
      '<span class="sp"></span>' +
      '<svg class="cv" width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      "</button>";
    if (open) {
      h += '<div class="items open">';
      for (var j = 0; j < list.length; j++) {
        var t = list[j];
        var on = state.cur === t.id;
        var doneT = !!state.played[t.id];
        h += '<div class="item' + (on ? " on" : "") + '" data-act="play" data-id="' + t.id + '">' +
          '<span class="ic">' + (on
            ? '<span class="eq"><i></i><i></i><i></i></span>'
            : '<svg width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>') + "</span>" +
          '<span class="tx"><b>' + esc(t.t) + "</b>" +
          (t.id === state.last && !on ? '<span class="last">上次听到 ' + fmt(state.pos[t.id] || 0) + "</span>" : "") +
          "</span>" +
          '<span class="du">' + (state.dur[t.id] ? fmt(state.dur[t.id]) : "--:--") + "</span>" +
          '<button class="ck' + (doneT ? " on" : "") + '" data-act="toggle" data-id="' + t.id + '" title="标记已听">' +
          (doneT ? '<svg width="21" height="21" viewBox="0 0 24 24" fill="#22C55E"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45L2.6 9.45l6.5-.95z"/></svg>'
                 : '<svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/></svg>') +
          "</button></div>";
      }
      h += "</div>";
    }
    h += "</div>";
  }
  if (!shown) {
    h = '<div class="empty"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" style="opacity:.5">' +
      '<circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' +
      '<div style="margin-top:8px">没找到哦，换个词试试～</div></div>';
  }
  document.getElementById("list").innerHTML = h;
}

function renderPlayer() {
  var t = state.cur ? byId(state.cur) : null;
  document.getElementById("pTitle").textContent = t ? t.t : "未选择音频";
  document.getElementById("pCur").textContent = fmt(audio.currentTime);
  document.getElementById("pDur").textContent = fmt(state.cur && state.dur[state.cur] ? state.dur[state.cur] : (audio.duration || 0));
  var playing = !audio.paused && !audio.ended;
  document.getElementById("icPlay").style.display = playing ? "none" : "";
  document.getElementById("icPause").style.display = playing ? "" : "none";
  document.getElementById("bRate").textContent = state.rate.toFixed(2).replace(/0$/, "").replace(/\.$/, "") + "x";
  document.getElementById("bAuto").textContent = "连播 " + (state.auto ? "开" : "关");
  document.getElementById("bAuto").className = "rate" + (state.auto ? " on" : "");
  document.getElementById("bRepeat").className = "ibtn" + (state.repeat ? " on" : "");
}

function renderSkin() {
  var boy = state.theme === "boy";
  document.documentElement.setAttribute("data-theme", boy ? "boy" : "girl");
  var bs = document.querySelectorAll("[data-skin]");
  for (var i = 0; i < bs.length; i++) {
    bs[i].className = "sk" + (bs[i].getAttribute("data-skin") === state.theme ? " on" : "");
  }
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute("content", boy ? "#3B82F6" : "#FF8FBF");
}

function refreshAll() {
  renderSkin();
  renderTabs();
  renderList();
  renderPlayer();
}

/* ---------- 播放控制 ---------- */
function playTrack(id, pos) {
  var t = byId(id);
  if (!t) return;
  state.cur = id;
  state.last = id;
  audio.src = encodeURI(t.f);
  audio.playbackRate = state.rate;
  var start = (typeof pos === "number") ? pos : (state.pos[id] || 0);
  audio.onloadedmetadata = function () {
    if (start > 0 && start < (audio.duration || 0) - 2) {
      try { audio.currentTime = start; } catch (e) {}
    }
  };
  var pr = audio.play();
  if (pr && pr.catch) pr.catch(function () {});
  save();
  refreshAll();
}
function step(dir) {
  var list = visible();
  if (!list.length) return;
  var idx = -1;
  for (var i = 0; i < list.length; i++) if (list[i].id === state.cur) { idx = i; break; }
  if (idx < 0) { playTrack(list[0].id, 0); return; }
  var n = idx + dir;
  if (n < 0) n = list.length - 1;
  if (n >= list.length) n = 0;
  playTrack(list[n].id, 0);
}
function onEnded() {
  if (state.repeat) { try { audio.currentTime = 0; audio.play(); } catch (e) {} return; }
  var list = visible(), idx = -1;
  for (var i = 0; i < list.length; i++) if (list[i].id === state.cur) { idx = i; break; }
  if (state.auto && idx >= 0 && idx < list.length - 1) { playTrack(list[idx + 1].id, 0); return; }
  refreshAll();
}

/* ---------- 时长探测 ---------- */
function probeDurations() {
  var i = 0;
  function next() {
    if (i >= TRACKS.length) { save(); return; }
    var t = TRACKS[i++];
    if (state.dur[t.id]) { next(); return; }
    var a = new Audio();
    a.preload = "metadata";
    a.onloadedmetadata = function () {
      if (a.duration && isFinite(a.duration)) { state.dur[t.id] = Math.round(a.duration); renderList(); }
      next();
    };
    a.onerror = function () { next(); };
    a.src = encodeURI(t.f);
  }
  next();
}

/* ---------- 事件绑定（一次性，全部用 body 委托 / 直接绑定固定元素） ---------- */
function bind() {
  document.body.addEventListener("click", function (e) {
    var sk = e.target.closest ? e.target.closest("[data-skin]") : null;
    if (sk) {
      state.theme = sk.getAttribute("data-skin") === "boy" ? "boy" : "girl";
      renderSkin(); save();
      return;
    }
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    var v = el.getAttribute("data-v");
    if (act === "toggle") {
      state.played[id] = !state.played[id];
      if (!state.played[id]) state.pos[id] = 0;
      save(); refreshAll();
    } else if (act === "play") {
      playTrack(id, state.played[id] ? 0 : (state.pos[id] || 0));
    } else if (act === "fold") {
      state.fold[v] = !isOpen(v);
      refreshAll();
    } else if (act === "unit") {
      state.unit = v;
      refreshAll();
    }
  });

  document.getElementById("search").addEventListener("input", function (e) {
    state.q = e.target.value.trim();
    renderList();
  });

  var range = document.getElementById("pRange");
  var seeking = false; /* 拖动中：暂停 timeupdate 回写滑块，避免来回打架 */

  /* 有效时长：duration 可能是 Infinity（VBR mp3），退回 seekable 末端 */
  function effDur() {
    if (isFinite(audio.duration) && audio.duration > 0) return audio.duration;
    try {
      var sk = audio.seekable;
      if (sk && sk.length > 0) {
        var end = sk.end(sk.length - 1);
        if (isFinite(end) && end > 0) return end;
      }
    } catch (e) {}
    return 0;
  }

  range.addEventListener("input", function () {
    seeking = true;
    var d = effDur();
    if (d) document.getElementById("pCur").textContent = fmt(d * (range.value / 1000));
  });
  range.addEventListener("change", function () {
    seeking = false;
    var d = effDur();
    if (d) {
      try { audio.currentTime = d * (range.value / 1000); } catch (e) {}
    }
    renderPlayer();
  });

  document.getElementById("bPlay").addEventListener("click", function () {
    if (!state.cur) {
      var l = visible();
      if (l.length) playTrack(l[0].id, 0);
      return;
    }
    if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
    else audio.pause();
    renderPlayer();
  });
  document.getElementById("bPrev").addEventListener("click", function () { step(-1); });
  document.getElementById("bNext").addEventListener("click", function () { step(1); });
  document.getElementById("bBack").addEventListener("click", function () {
    audio.currentTime = Math.max(0, (audio.currentTime || 0) - 15);
    renderPlayer();
  });
  document.getElementById("bRate").addEventListener("click", function () {
    var i = RATES.indexOf(state.rate);
    state.rate = RATES[(i + 1) % RATES.length];
    audio.playbackRate = state.rate;
    save(); renderPlayer();
  });
  document.getElementById("bRepeat").addEventListener("click", function () {
    state.repeat = !state.repeat; save(); renderPlayer();
  });
  document.getElementById("bAuto").addEventListener("click", function () {
    state.auto = !state.auto; save(); renderPlayer();
  });

  audio.addEventListener("timeupdate", function () {
    if (!seeking && isFinite(audio.duration) && audio.duration > 0) document.getElementById("pRange").value = String(Math.round(audio.currentTime / audio.duration * 1000));
    document.getElementById("pCur").textContent = fmt(audio.currentTime);
    if (state.cur) {
      state.pos[state.cur] = audio.currentTime;
      saveTick++;
      if (saveTick % 10 === 0) save();
    }
  });
  audio.addEventListener("loadedmetadata", function () {
    /* VBR mp3 在 Chromium 里 duration 可能是 Infinity，不能用 */
    if (state.cur && isFinite(audio.duration) && audio.duration > 0) state.dur[state.cur] = Math.round(audio.duration);
    renderPlayer();
  });
  audio.addEventListener("play", function () { renderPlayer(); renderList(); });
  audio.addEventListener("pause", function () { if (state.cur) state.pos[state.cur] = audio.currentTime; save(); renderPlayer(); });
  audio.addEventListener("ended", function () { if (state.cur) { state.played[state.cur] = true; state.pos[state.cur] = 0; save(); } onEnded(); });
}

/* ---------- 启动 ---------- */
document.addEventListener("DOMContentLoaded", function () {
  load();
  audio.playbackRate = state.rate;
  var us = units();
  for (var i = 0; i < us.length; i++) state.fold[us[i]] = false;
  var lt = state.last ? byId(state.last) : null;
  var first = lt ? lt.u : us[0];
  if (first) state.fold[first] = true;
  bind();
  refreshAll();
  probeDurations();
});
</script>
</body>
</html>
